version: '3.8'

# Verification sandboxing requires one of the following execution modes:
# 1. Nebius Serverless Jobs API (Recommended): Set NEBIUS_SERVERLESS_JOB_ENDPOINT in .env
# 2. Local Docker Sandbox: Host Docker daemon access (e.g. mount /var/run/docker.sock)
# 3. Unsafe Local Process Sandbox (Dev fallback): Set ALLOW_UNSAFE_LOCAL_SANDBOX=1

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: driftzero-backend
    expose:
      - "8000"
    environment:
      - NEBIUS_API_KEY=${NEBIUS_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - NEBIUS_SERVERLESS_JOB_ENDPOINT=${NEBIUS_SERVERLESS_JOB_ENDPOINT:-}
      - DRIFTZERO_API_KEY=${DRIFTZERO_API_KEY:-}
      - ALLOW_LOCAL_REPOS=${ALLOW_LOCAL_REPOS:-0}
      - ALLOW_UNSAFE_LOCAL_SANDBOX=${ALLOW_UNSAFE_LOCAL_SANDBOX:-0}
      - TRUSTED_PROXY=1
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_URL=http://backend:8000
    container_name: driftzero-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - DRIFTZERO_API_KEY=${DRIFTZERO_API_KEY:?set DRIFTZERO_API_KEY in .env (openssl rand -hex 32)}
    depends_on:
      - backend
    restart: unless-stopped

