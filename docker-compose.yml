version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: driftzero-backend
    ports:
      - "8000:8000"
    environment:
      - NEBIUS_API_KEY=${NEBIUS_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - NEBIUS_SERVERLESS_JOB_ENDPOINT=${NEBIUS_SERVERLESS_JOB_ENDPOINT:-}
      - ALLOW_LOCAL_REPOS=1
      - PYTHONUNBUFFERED=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: driftzero-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
